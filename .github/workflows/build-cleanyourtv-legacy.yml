name: Build CleanYourTV Legacy for Android 7
on:
  push:
    branches:
      - temp/cleanyourtv-legacy-android7-build
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the publicly maintained Android 7 fork
        uses: actions/checkout@v4
        with:
          repository: johnsontsai11/cleanyourtv-legacy
          ref: 7bb0b33a733ea04bb3074cc4a35234d6bc0ce9cd
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 34 build requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build signed release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Verify APK compatibility and checksum
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          sha256sum "$APK"
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-legacy-android7-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
