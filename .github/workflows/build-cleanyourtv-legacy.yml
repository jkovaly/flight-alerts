name: Build official CleanYourTV Android 11 APK for Sharp
on:
  push:
    branches:
      - temp/cleanyourtv-legacy-android7-build
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the official CleanYourTV repository
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: 7b7666ad05a3a62ba25768c51fbf06e9c4e67da5
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 34 build requirements
        run: |
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
      - name: Build signed release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Verify APK compatibility and checksum
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          sha256sum "$APK"
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-sharp-android11-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
